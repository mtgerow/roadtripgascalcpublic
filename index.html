<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Trip Gas Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #404040;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .tagline {
      font-size: 16px;
      color: #cccccc;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .links a {
      display: block;
      background-color: #5DDDEA;
      color: #111111;
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
      padding: 16px 32px;
      border-radius: 12px;
      transition: opacity 0.15s ease;
    }

    .links a:hover {
      opacity: 0.85;
    }

    .links a.secondary {
      background-color: transparent;
      color: #5DDDEA;
      border: 2px solid #5DDDEA;
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="RoadTripGasCalculator/Logo.png" alt="Road Trip Gas Calculator logo" class="logo" />
    <h1>Road Trip Gas Calculator</h1>
    <p class="tagline">
      Quickly calculate your trip cost, fuel usage, and cost per mile.<br />
      Fast, easy, and fun to use — every time you hit the road.
    </p>

    <div class="links">
      <a href="support.html">Support</a>
      <a href="privacy.html" class="secondary">Privacy Policy</a>
    </div>
  </div>

  <footer>
    &copy; 2026 MG Studios. All rights reserved.
  </footer>
</body>
</html>
